<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- CSP set here (not just via a backend header) since the frontend is static-hosted
         separately from the API — a meta tag applies regardless of what serves this file. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://school-management-api-pk37.onrender.com https://sandbox.safaricom.co.ke https://api.safaricom.co.ke https://payment.intasend.com https://api.intasend.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SkulManager" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO — keyword-first title for Google ranking -->
    <title>School Management System Kenya | SkulManager – CBC Aligned</title>
    <meta name="description" content="School management system built for Kenya's CBC curriculum. SkulManager manages students, teachers, fees, exams, timetables and parent communication — all in one secure cloud platform. M-Pesa integrated." />
    <meta name="keywords" content="school management system Kenya, school management system, Kenya school management software, CBC school system, CBC curriculum software, student management system Kenya, CBC grading EE ME AE BE, M-Pesa school fees, Kenya school software, SkulManager, skulmanager.org, Helvino Technologies Siaya" />
    <meta name="author" content="Helvino Technologies Limited" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://skulmanager.org/" />

    <!-- Geo targeting — helps rank in Kenya searches -->
    <meta name="geo.region" content="KE" />
    <meta name="geo.placename" content="Kenya" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skulmanager.org/" />
    <meta property="og:title" content="School Management System Kenya | SkulManager – CBC Aligned" />
    <meta property="og:description" content="Kenya's #1 cloud-based school management system for CBC curriculum. Manage students, fees, exams, timetables and parent communication in one place. M-Pesa integrated." />
    <meta property="og:image" content="https://skulmanager.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="SkulManager" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="School Management System Kenya | SkulManager – CBC Aligned" />
    <meta name="twitter:description" content="Kenya's #1 school management system for CBC. M-Pesa integrated, CBC-aligned, secure cloud platform. Try SkulManager today." />
    <meta name="twitter:image" content="https://skulmanager.org/og-image.png" />

    <!-- Schema 1: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SkulManager",
      "alternateName": "Skul Manager School Management System",
      "url": "https://skulmanager.org",
      "description": "Kenya's most comprehensive CBC-aligned school management system. Manage students, teachers, fees, exams, timetables and parent communication all in one place.",
      "applicationCategory": "EducationApplication",
      "applicationSubCategory": "School Management System",
      "operatingSystem": "Web Browser",
      "inLanguage": "en-KE",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KES",
        "description": "Contact Helvino Technologies for pricing"
      },
      "featureList": [
        "CBC Curriculum Management",
        "Student Records Management",
        "M-Pesa Fee Collection",
        "Exam and Results Management",
        "Parent Communication Portal",
        "Timetable Scheduling",
        "CBC Report Cards (EE/ME/AE/BE)",
        "Real-time Analytics Dashboard"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Helvino Technologies Limited",
        "url": "https://helvino.org",
        "email": "info@helvino.org",
        "telephone": "+254110421320",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Siaya",
          "addressCountry": "KE"
        }
      }
    }
    </script>

    <!-- Schema 2: Organization (brand authority signal) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Helvino Technologies Limited",
      "url": "https://helvino.org",
      "logo": "https://skulmanager.org/icon-512.png",
      "email": "info@helvino.org",
      "telephone": "+254110421320",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Siaya",
        "addressCountry": "KE"
      },
      "sameAs": ["https://skulmanager.org"]
    }
    </script>

    <!-- Schema 3: WebSite with search action (enables Google Sitelinks Searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SkulManager – School Management System Kenya",
      "url": "https://skulmanager.org",
      "description": "School management system for Kenya's CBC curriculum",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://skulmanager.org/?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Schema 4 (FAQPage) lives in LandingPage.tsx now, injected only on "/" —
         a FAQPage schema describing homepage-targeted Q&As shouldn't be present
         on every route of this SPA (it used to be, since this file is static). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
